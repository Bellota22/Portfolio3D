<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="GV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0039AC"></stop>
      <stop offset="100%" stop-color="#001F5A"></stop>
    </linearGradient>
    <style>
      :root {
        --bg: url(#bg);
        --fg: #FFFFFF;
        --shadow: rgba(0,0,0,0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0F172A;      /* slate-900 */
          --fg: #F3890B;      /* tu acento anaranjado */
          --shadow: rgba(0,0,0,0.35);
        }
      }
    </style>
  </defs>

  <!-- fondo con esquinas redondeadas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="var(--bg)"></rect>

  <!-- sutil sombra interior para dar profundidad -->
  <g opacity="0.9" filter="url(#f0)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="transparent"></rect>
  </g>
  <defs>
    <filter id="f0" x="-50%" y="-50%" width="200%" height="200%">
      <feinset dx="0" dy="1" stdDeviation="0.8" flood-color="var(--shadow)" flood-opacity="1"></feinset>
    </filter>
  </defs>

  <!-- monograma "G" + "V" en trazo -->
  <g fill="none" stroke="var(--fg)" stroke-linecap="round" stroke-linejoin="round">
    <!-- V -->
    <path d="M18 22 L26 42 L34 22" stroke-width="5.2"></path>

    <!-- G: arco + barra -->
    <!-- arco casi completo desde 46,24 hasta 46,40 -->
    <path d="M46 24
             A14 14 0 1 0 46 40" stroke-width="5.2"></path>
    <!-- pequeña barra para formar la 'G' -->
    <path d="M38 40 H48" stroke-width="5.2"></path>
  </g>
</svg>
